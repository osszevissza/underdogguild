<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>

    <meta name="description" content="{{ .Site.Params.description }}">
    <meta name="author" content="Underdog Guild">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#f2ede1">
    <link rel="canonical" href="{{ .Permalink }}">

    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Underdog Guild">
    <meta property="og:locale" content="hu_HU">
    <meta property="og:title" content="{{ .Title }}">
    <meta property="og:description" content="{{ .Site.Params.description }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:image" content="{{ "img/og.png" | absURL }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Underdog Guild – webstúdió logó">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ .Title }}">
    <meta name="twitter:description" content="{{ .Site.Params.description }}">
    <meta name="twitter:image" content="{{ "img/og.png" | absURL }}">

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="{{ "/fonts/SpartanMB/SpartanMB-Regular.css" | relURL }}">
    <link rel="stylesheet" href="{{ "/fonts/GeneralSans/GeneralSans.css" | relURL }}">
</head>

<body>

    <a href="#main-content" class="skip-link">
        Ugrás a tartalomra
    </a>

    <div class="hazard-bar" aria-hidden="true"></div>

    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-logo" href="#main-content">
                <img class="site-logo__mark" src="/img/logo.svg" alt="" width="42" height="42">
                <span class="site-logo__name">Underdog&nbsp;Guild</span>
                <span class="site-logo__tag">WEBSTÚDIÓ</span>
            </a>

            <nav class="site-nav" aria-label="Fő navigáció">
                <a href="#portfolio">Portfólió</a>
                <a href="#szolgaltatasok">Szolgáltatások</a>
                <a href="#eszkoztar">Eszköztár</a>
                <a href="#kapcsolat">Kapcsolat</a>
            </nav>

            <a href="#" class="btn btn--small js-email" data-js-email>Írj nekem</a>
        </div>
    </header>

    <main id="main-content">
        {{ block "main" . }}{{ end }}
    </main>

    <footer class="site-footer">
        <div class="hazard-bar" aria-hidden="true"></div>
        <div class="site-footer__inner">
            <p>{{ now.Year }} Underdog Guild</p>
            <p class="site-footer__note">
                Készült Hugoval és sok kávéval ·
                <a href="https://unlicense.org/" target="_blank" rel="noopener noreferrer">
                    Unlicense
                </a>
            </p>
        </div>
    </footer>

<script src="{{ "/js/header.js" | relURL }}"></script>
<script src="{{ "/js/email.js" | relURL }}"></script>
</body>
</html>
