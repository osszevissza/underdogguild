# About
about_title = "Who is this?"
about_intro = "One person. Marina. (The stage name is a nod to my favourite band.)"
about_p1 = "I studied communication and economics, then spent years organising SzimplaCity's programmes, before life swept me out to the countryside and into a crane repair shop."
about_p2 = "Today I build sites with Hugo and good old HTML/CSS, while studying Data Science at master's level and learning TypeScript and React on the side. Next stop: MLOps, a bit more thoroughly."
about_p3 = "No marketing speak here: if I don't know something, I say so and look it up. If I promise something, you can count on it."

